<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cowy · Console</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--mint:#A3E2C9;--mint-deep:#5FBF9B;--mint-soft:#E7F6EF;--ink:#1C2521;--paper:#EEF5F0;--card:#FFFFFF;--border:#DDEAE3;--muted:#5E726A;--good:#3C7A4E;--warn:#C98A2B;--bad:#B23B3B;--sans:'Nunito',sans-serif;--mono:'Geist Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5}
.mono{font-family:var(--mono)}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:.8rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.15rem}
.savedot{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:8px;background:var(--mint-soft);color:var(--mint-deep)}
.tabs{display:flex;gap:4px;padding:.7rem 1.1rem 0;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:57px;z-index:49}
.tab{padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;border:none;border-radius:8px 8px 0 0;background:transparent;color:var(--muted)}
.tab.active{background:var(--mint-deep);color:#fff}
.wrap{max-width:840px;margin:0 auto;padding:1rem 1.1rem 4rem}
.view{display:none}.view.active{display:block}
.step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:1rem}
.steplabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint-deep);margin-bottom:.6rem;font-weight:500}
h2{font-size:1.05rem;margin-bottom:.5rem}
.fieldrow{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.field{flex:1;min-width:170px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:.3rem}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:9px;font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:58px}
.hint{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:.2rem;line-height:1.45}
.btn{border:none;background:var(--mint-deep);color:#fff;border-radius:9px;padding:.6rem 1rem;font-family:var(--sans);font-weight:800;font-size:13px;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:700}
.btn.sm{padding:.4rem .7rem;font-size:12px}
.btn.danger{color:var(--bad);border-color:#E8C9C2}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}

/* leads */
.lead{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:.9rem 1rem;margin-bottom:.7rem}
.lead .lh{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.lead .lname{font-weight:800;font-size:1rem}
.lead .lcat{font-size:11px;font-family:var(--mono);color:var(--muted)}
.pill{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:20px;font-weight:700}
.pill.lead-s{background:#EEE;color:#666}.pill.audited{background:var(--mint-soft);color:var(--good)}.pill.sent{background:rgba(201,138,43,.15);color:var(--warn)}
.lead .lmeta{font-size:11.5px;color:var(--muted);margin-top:.3rem}
.lead .lactions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.scoretag{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin-left:auto}

/* audit */
.scorebar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.scorecard{flex:1;min-width:115px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:.6rem}
.scorecard .n{font-family:var(--mono);font-size:1.35rem;font-weight:700}
.scorecard .l{font-size:10px;color:var(--muted);line-height:1.3}
.totalbox{text-align:center;background:var(--ink);color:#fff;border-radius:12px;padding:1rem;margin-top:.6rem}
.totalbox .big{font-family:var(--mono);font-size:2.3rem;font-weight:700;color:var(--mint)}
.q{border:1px solid var(--border);border-radius:11px;padding:.8rem;margin-bottom:.7rem;background:var(--paper)}
.q .qtop{display:flex;align-items:flex-start;gap:.5rem;justify-content:space-between}
.q .qtext{font-family:var(--mono);font-size:13px;font-weight:500;flex:1;line-height:1.4}
.q .qtype{font-size:9px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 6px;white-space:nowrap}
.q .copyq{cursor:pointer;border:1px solid var(--border);background:var(--card);border-radius:6px;padding:2px 7px;font-size:10px;font-family:var(--mono);color:var(--muted)}
.q .controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:.35rem .6rem;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);font-family:var(--sans)}
.seg button:last-child{border-right:none}
.seg button.on-yes{background:var(--good);color:#fff}.seg button.on-no{background:var(--bad);color:#fff}
.seg button.on-acc-none{background:var(--good);color:#fff}.seg button.on-acc-minor{background:var(--warn);color:#fff}.seg button.on-acc-major{background:var(--bad);color:#fff}
.miniL{font-size:11px;color:var(--muted);font-weight:700}
.q input.named,.q input.notes{margin-top:.5rem;font-size:12.5px}
.checkitem{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.checkitem:last-child{border-bottom:none}
.checkitem input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.checkitem .ct{font-size:13px}.checkitem .cd{font-size:11px;color:var(--muted)}
.report{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--mint-soft);border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-top:.6rem;width:100%;min-height:120px}
.note{font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.5;margin-top:.5rem}
.empty{text-align:center;color:var(--muted);padding:2rem 1rem;font-size:14px}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><span>🐮</span> cowy <span class="mono" style="font-size:11px;color:var(--muted);font-weight:400">CONSOLE</span></div>
  <span class="savedot" id="savedot">saved</span>
</div>
<div class="tabs">
  <button class="tab active" id="tab-leads" onclick="showTab('leads')">Leads &amp; clients</button>
  <button class="tab" id="tab-audit" onclick="showTab('audit')">Audit</button>
</div>

<div class="wrap">
  <!-- LEADS VIEW -->
  <div class="view active" id="view-leads">
    <div class="toolbar">
      <button class="btn" onclick="toggleAddForm()">+ Add lead</button>
      <button class="btn ghost sm" onclick="exportAll(this)">Export all</button>
    </div>
    <div class="step" id="addForm" style="display:none">
      <div class="steplabel">New lead</div>
      <div class="fieldrow">
        <div class="field"><label>Brand *</label><input id="nl_brand" placeholder="e.g. Bobbie"></div>
        <div class="field"><label>Category</label><select id="nl_cat" onchange="toggleNlOther()"></select></div>
      </div>
      <div class="fieldrow" id="nl_otherRow" style="display:none">
        <div class="field"><label>Describe category</label><input id="nl_catother" placeholder="e.g. teething products"></div>
      </div>
      <div class="fieldrow">
        <div class="field"><label>Top competitor</label><input id="nl_comp" placeholder="e.g. Kendamil"></div>
        <div class="field"><label>Store URL</label><input id="nl_url" placeholder="https://"></div>
      </div>
      <div class="fieldrow">
        <div class="field"><label>Contact email</label><input id="nl_email" placeholder="founder@brand.com"></div>
        <div class="field"><label>Key buyer question</label><input id="nl_q" placeholder="e.g. is it palm-oil free?"></div>
      </div>
      <div class="field"><label>Ground-truth facts (real specs, your answer key for accuracy)</label><textarea id="nl_truth" placeholder="USDA + EU organic; palm-oil free; GOS not HMO; no recalls"></textarea></div>
      <div class="field"><label>Notes</label><textarea id="nl_notes" placeholder="Anything useful"></textarea></div>
      <div class="toolbar" style="margin-top:.6rem;margin-bottom:0">
        <button class="btn" onclick="addLead()">Save lead</button>
        <button class="btn ghost" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>
    <div id="leadsList"></div>
  </div>

  <!-- AUDIT VIEW -->
  <div class="view" id="view-audit">
    <div id="auditEmpty" class="empty">Pick a lead from the Leads tab and tap “Run audit” to start. The audit will pre-fill from that lead.</div>
    <div id="auditBody" style="display:none"></div>
  </div>
</div>

<script>
// ---------- category taxonomy ----------
const CATS = [
  ['Consumables',[['formula','Baby formula'],['food','Baby food / pouches'],['diapers','Diapers'],['wipes','Baby wipes'],['snacks','Toddler snacks'],['skincare','Baby skincare / bath'],['vitamins','Baby / kids vitamins']]],
  ['Gear & travel',[['carseats','Car seats'],['strollers','Strollers / travel systems'],['carriers','Carriers / wraps'],['travel','Travel gear']]],
  ['Nursery & furniture',[['furniture','Nursery furniture'],['mattress','Crib mattresses'],['monitors','Baby monitors'],['bedding','Bedding / sleep sacks']]],
  ['Feeding & nursing',[['bottles','Bottles / sippy cups'],['breastpumps','Breast pumps'],['highchairs','High chairs']]],
  ['Apparel & footwear',[['clothing','Baby / kids clothing'],['footwear','Kids footwear']]],
  ['Play & other',[['toys','Toys / games'],['bath','Bath / potty'],['safety','Baby-proofing / safety'],['other','Other (type below)']]]
];
const NEED={formula:{good:"for sensitive tummies",bad:"palm oil"},food:{good:"for starting solids",bad:"heavy metals"},diapers:{good:"for blowouts",bad:"fragrance"},wipes:{good:"for sensitive skin",bad:"alcohol"},snacks:{good:"that are nut-free",bad:"added sugar"},skincare:{good:"for eczema",bad:"fragrance"},vitamins:{good:"for picky eaters",bad:"sugar"},carseats:{good:"for small cars",bad:"a hard install"},strollers:{good:"for travel",bad:"bulk"},carriers:{good:"for newborns",bad:"back strain"},travel:{good:"for flying",bad:"bulk"},furniture:{good:"for small nurseries",bad:"toxic finishes"},mattress:{good:"for newborn safety",bad:"toxic foam"},monitors:{good:"with best range",bad:"wifi security issues"},bedding:{good:"for safe sleep",bad:"loose fabric"},bottles:{good:"for breastfed babies",bad:"colic"},breastpumps:{good:"for working moms",bad:"noise"},highchairs:{good:"for small spaces",bad:"hard-to-clean crevices"},clothing:{good:"for sensitive skin",bad:"synthetic fabric"},footwear:{good:"for wide feet",bad:"stiff soles"},toys:{good:"for development",bad:"toxic plastics"},bath:{good:"for newborns",bad:"slipping"},safety:{good:"for babyproofing",bad:"hard installation"},other:{good:"for newborns",bad:"poor quality"}};
const CATNAME={formula:"baby formula",food:"baby food",diapers:"diapers",wipes:"baby wipes",snacks:"toddler snacks",skincare:"baby skincare",vitamins:"kids vitamins",carseats:"car seats",strollers:"strollers",carriers:"baby carriers",travel:"baby travel gear",furniture:"nursery furniture",mattress:"crib mattresses",monitors:"baby monitors",bedding:"baby bedding",bottles:"baby bottles",breastpumps:"breast pumps",highchairs:"high chairs",clothing:"baby clothes",footwear:"kids shoes",toys:"baby toys",bath:"baby bath products",safety:"baby safety products",other:"products"};
function catOptionsHtml(sel){
  let h='';
  CATS.forEach(g=>{ h+=`<optgroup label="${g[0]}">`; g[1].forEach(o=>{ h+=`<option value="${o[0]}"${o[0]===sel?' selected':''}>${o[1]}</option>`; }); h+='</optgroup>'; });
  return h;
}
function catLabelFor(lead){ if(lead.cat==='other') return (lead.catother&&lead.catother.trim())||'products'; return CATNAME[lead.cat]||'products'; }

const SCHEMA=[['prod',"Product schema (JSON-LD)","name, image, brand, offers, price, availability"],['org',"Organization schema sitewide","brand identity AI can attach facts to"],['faq',"FAQ schema with real buyer questions","answers AI can lift directly"],['attr',"Complete product attributes","price, availability, rating all present"],['crawl',"AI crawlers allowed in robots.txt","OAI-SearchBot not blocked"]];

function queryList(lead){
  const c=catLabelFor(lead); const n=NEED[lead.cat]||{good:"",bad:""}; const b=lead.brand||"[brand]";
  return [
    {id:0,type:'rec',t:`best ${c} 2026`},{id:1,type:'rec',t:`best organic ${c}`},
    {id:2,type:'rec',t:`safest ${c} for newborns`},{id:3,type:'rec',t:`best ${c} ${n.good}`},
    {id:4,type:'rec',t:`${c} without ${n.bad}`},{id:5,type:'rec',t:`most recommended ${c} brands`},
    {id:6,type:'rec',t:`top ${c} brands parents trust`},
    {id:7,type:'brand',t:`is ${b} ${c} good?`},{id:8,type:'brand',t:`what's in ${b} ${c}? (specs)`},
    {id:9,type:'brand',t:`${b} vs ${lead.comp||'[competitor]'}`},{id:10,type:'brand',t:`is ${b} safe — any recalls?`},
    {id:11,type:'brand',t:`is ${b} ${c} [your key claim]?`}
  ];
}

// ---------- state / storage ----------
let state=null; const KEY='cowy_console_v1';
function newLead(){ return {id:'L'+Date.now()+Math.floor(Math.random()*999), brand:'',cat:'formula',catother:'',comp:'',url:'',email:'',question:'',truth:'',notes:'',status:'lead', q:{},schema:{},scores:null,report:'',created:Date.now()}; }
async function load(){
  try{ const r=await window.storage.get(KEY); if(r&&r.value) state=JSON.parse(r.value);}catch(e){}
  if(!state) state={clients:[], currentId:null};
  // seed add-form category select
  document.getElementById('nl_cat').innerHTML=catOptionsHtml('formula');
  renderLeads(); renderAudit();
}
let t=null;
async function save(){ try{document.getElementById('savedot').textContent='saving…'; await window.storage.set(KEY,JSON.stringify(state)); document.getElementById('savedot').textContent='saved';}catch(e){document.getElementById('savedot').textContent='save failed';} }
function queueSave(){ clearTimeout(t); t=setTimeout(save,400); }
function cur(){ return state.clients.find(c=>c.id===state.currentId); }

// ---------- tabs ----------
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---------- add lead ----------
function toggleAddForm(){ const f=document.getElementById('addForm'); f.style.display=f.style.display==='none'?'block':'none'; }
function toggleNlOther(){ document.getElementById('nl_otherRow').style.display=document.getElementById('nl_cat').value==='other'?'flex':'none'; }
function addLead(){
  const b=document.getElementById('nl_brand').value.trim();
  if(!b){ alert('Add a brand name.'); return; }
  const L=newLead();
  L.brand=b; L.cat=document.getElementById('nl_cat').value; L.catother=document.getElementById('nl_catother').value.trim();
  L.comp=document.getElementById('nl_comp').value.trim(); L.url=document.getElementById('nl_url').value.trim();
  L.email=document.getElementById('nl_email').value.trim(); L.question=document.getElementById('nl_q').value.trim();
  L.truth=document.getElementById('nl_truth').value.trim(); L.notes=document.getElementById('nl_notes').value.trim();
  state.clients.unshift(L); save(); 
  ['nl_brand','nl_comp','nl_url','nl_email','nl_q','nl_truth','nl_notes','nl_catother'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('addForm').style.display='none';
  renderLeads();
}

// ---------- render leads ----------
function renderLeads(){
  const wrap=document.getElementById('leadsList'); wrap.innerHTML='';
  if(!state.clients.length){ wrap.innerHTML='<div class="empty">No leads yet. Tap “+ Add lead” to create your first, or it’ll come from your intake form once that’s wired up.</div>'; return; }
  state.clients.forEach(L=>{
    const div=document.createElement('div'); div.className='lead';
    const statusPill = L.status==='audited'?'<span class="pill audited">audited</span>': L.status==='sent'?'<span class="pill sent">report sent</span>':'<span class="pill lead-s">lead</span>';
    const scoreTag = L.scores? `<span class="scoretag">${L.scores.total}/100</span>`:'';
    div.innerHTML=`
      <div class="lh"><span class="lname">${esch(L.brand)}</span> <span class="lcat">${esch(catLabelFor(L))}</span> ${statusPill} ${scoreTag}</div>
      <div class="lmeta">${L.comp?('vs '+esch(L.comp)+' · '):''}${L.email?esch(L.email):'no email'}</div>
      <div class="lactions">
        <button class="btn sm" onclick="runAudit('${L.id}')">${L.scores?'Continue audit':'Run audit'}</button>
        ${L.report?`<button class="btn ghost sm" onclick="viewReport('${L.id}')">View report</button>`:''}
        <button class="btn ghost sm danger" onclick="delLead('${L.id}',this)">Delete</button>
      </div>`;
    wrap.appendChild(div);
  });
}
function runAudit(id){ state.currentId=id; save(); showTab('audit'); renderAudit(); }
let delArmed={};
function delLead(id,btn){ if(!delArmed[id]){ delArmed[id]=true; const p=btn.textContent; btn.textContent='Tap to confirm'; setTimeout(()=>{delArmed[id]=false; btn.textContent=p;},2500); return;} state.clients=state.clients.filter(c=>c.id!==id); if(state.currentId===id) state.currentId=null; save(); renderLeads(); renderAudit(); }

// ---------- render audit (pre-filled from current lead) ----------
function renderAudit(){
  const L=cur();
  document.getElementById('auditEmpty').style.display=L?'none':'block';
  document.getElementById('auditBody').style.display=L?'block':'none';
  if(!L) return;
  const body=document.getElementById('auditBody');
  body.innerHTML=`
    <div class="step">
      <div class="steplabel">Auditing</div>
      <div class="fieldrow">
        <div class="field"><label>Brand</label><input id="a_brand" value="${escAttr(L.brand)}"></div>
        <div class="field"><label>Category</label><select id="a_cat">${catOptionsHtml(L.cat)}</select></div>
      </div>
      <div class="fieldrow" id="a_otherRow" style="display:${L.cat==='other'?'flex':'none'}">
        <div class="field"><label>Describe category</label><input id="a_catother" value="${escAttr(L.catother)}"></div>
      </div>
      <div class="fieldrow">
        <div class="field"><label>Top competitor</label><input id="a_comp" value="${escAttr(L.comp)}"></div>
      </div>
      <div class="field"><label>Ground-truth facts (answer key)</label><textarea id="a_truth">${esch(L.truth)}</textarea></div>
    </div>
    <div class="step">
      <div class="steplabel">Step 2 · Run each query, record what came back</div>
      <div id="queries"></div>
    </div>
    <div class="step">
      <div class="steplabel">Step 3 · Site check (labels AI can read)</div>
      <p class="note" style="margin-top:0">Open the store, use Google Rich Results Test + View Source. Tick what's present.</p>
      <div id="schemaChecks"></div>
    </div>
    <div class="step">
      <div class="steplabel">Step 4 · Score</div>
      <div class="scorebar">
        <div class="scorecard"><div class="n" id="s1">0</div><div class="l">Gets named</div></div>
        <div class="scorecard"><div class="n" id="s2">0</div><div class="l">Likely cited</div></div>
        <div class="scorecard"><div class="n" id="s3">0</div><div class="l">Labels AI reads</div></div>
        <div class="scorecard"><div class="n" id="s4">0</div><div class="l">Accuracy</div></div>
      </div>
      <div class="totalbox"><div class="big" id="total">0</div><div style="font-size:12px;color:rgba(255,255,255,.7)">AI Visibility Score / 100</div></div>
    </div>
    <div class="step">
      <div class="steplabel">Step 5 · Generate &amp; save the report</div>
      <div class="toolbar">
        <button class="btn" onclick="genReport()">Generate report</button>
        <button class="btn ghost" onclick="copyReport(this)">Copy report</button>
        <button class="btn ghost" onclick="markSent(this)">Mark report sent</button>
      </div>
      <textarea class="report" id="reportOut" readonly onclick="this.select()" style="display:${L.report?'block':'none'}">${esch(L.report||'')}</textarea>
      <div class="note">Saved onto this lead automatically. Copy it into the client's Notion report page. Numbers come from what you recorded, not placeholders.</div>
    </div>`;
  // bind setup fields
  document.getElementById('a_brand').oninput=e=>{L.brand=e.target.value; queueSave(); renderQueries();};
  document.getElementById('a_cat').onchange=e=>{L.cat=e.target.value; document.getElementById('a_otherRow').style.display=e.target.value==='other'?'flex':'none'; queueSave(); renderQueries();};
  const ao=document.getElementById('a_catother'); if(ao) ao.oninput=e=>{L.catother=e.target.value; queueSave(); renderQueries();};
  document.getElementById('a_comp').oninput=e=>{L.comp=e.target.value; queueSave(); renderQueries();};
  document.getElementById('a_truth').oninput=e=>{L.truth=e.target.value; queueSave();};
  renderQueries(); renderSchema(); score();
}

function renderQueries(){
  const L=cur(); if(!L) return;
  const list=queryList(L); const wrap=document.getElementById('queries'); if(!wrap) return; wrap.innerHTML='';
  list.forEach(q=>{
    const rec=L.q[q.id]||{named:null,others:'',acc:null,notes:''};
    const div=document.createElement('div'); div.className='q';
    div.innerHTML=`
      <div class="qtop"><span class="qtext">"${esch(q.t)}"</span><span class="qtype">${q.type==='rec'?'should name you':'about you'}</span><span class="copyq">copy</span></div>
      <div class="controls">
        <span class="miniL">Named you?</span>
        <span class="seg"><button data-yn="yes">Yes</button><button data-yn="no">No</button></span>
        ${q.type==='brand'?`<span class="miniL">Accuracy</span><span class="seg"><button data-acc="none">Correct</button><button data-acc="minor">Minor</button><button data-acc="major">Wrong</button></span>`:''}
      </div>
      <input class="named" placeholder="Who else did AI name?" value="${escAttr(rec.others)}">
      ${q.type==='brand'?`<input class="notes" placeholder="What did it get wrong? (the fact)" value="${escAttr(rec.notes)}">`:''}`;
    wrap.appendChild(div);
    div.querySelector('.copyq').onclick=()=>{ robustCopy(q.t, div.querySelector('.copyq')); };
    div.querySelectorAll('[data-yn]').forEach(btn=>{ if(rec.named===btn.dataset.yn) btn.classList.add(btn.dataset.yn==='yes'?'on-yes':'on-no'); btn.onclick=()=>{rec.named=btn.dataset.yn; L.q[q.id]=rec; renderQueries(); queueSave(); score();}; });
    div.querySelectorAll('[data-acc]').forEach(btn=>{ if(rec.acc===btn.dataset.acc) btn.classList.add('on-acc-'+btn.dataset.acc); btn.onclick=()=>{rec.acc=btn.dataset.acc; L.q[q.id]=rec; renderQueries(); queueSave(); score();}; });
    div.querySelector('.named').oninput=e=>{rec.others=e.target.value; L.q[q.id]=rec; queueSave();};
    const ne=div.querySelector('.notes'); if(ne) ne.oninput=e=>{rec.notes=e.target.value; L.q[q.id]=rec; queueSave();};
  });
}
function renderSchema(){
  const L=cur(); if(!L) return;
  const wrap=document.getElementById('schemaChecks'); if(!wrap) return; wrap.innerHTML='';
  SCHEMA.forEach(s=>{
    const on=!!L.schema[s[0]]; const div=document.createElement('div'); div.className='checkitem';
    div.innerHTML=`<input type="checkbox" ${on?'checked':''}><div><div class="ct">${s[1]}</div><div class="cd">${s[2]}</div></div>`;
    div.querySelector('input').onchange=e=>{L.schema[s[0]]=e.target.checked; queueSave(); score();};
    wrap.appendChild(div);
  });
}
function score(){
  const L=cur(); if(!L) return;
  const list=queryList(L); const rec=list.filter(q=>q.type==='rec'), bq=list.filter(q=>q.type==='brand');
  let ra=0,rn=0; rec.forEach(q=>{const r=L.q[q.id]; if(r&&r.named){ra++; if(r.named==='yes')rn++;}});
  const s1=ra?Math.round(rn/ra*25):0;
  let ba=0,bc=0; bq.forEach(q=>{const r=L.q[q.id]; if(r&&r.acc){ba++; if(r.acc==='none')bc++;}});
  const s2=ba?Math.round(bc/ba*25):0;
  const s3=SCHEMA.reduce((a,s)=>a+(L.schema[s[0]]?5:0),0);
  let s4=25; bq.forEach(q=>{const r=L.q[q.id]; if(r){if(r.acc==='minor')s4-=3; if(r.acc==='major')s4-=8;}}); s4=Math.max(0,s4);
  const total=s1+s2+s3+s4;
  L.scores={s1,s2,s3,s4,total,namedCount:rn,recTotal:rec.length};
  if(L.status==='lead' && (ra||ba||s3)) L.status='audited';
  ['s1','s2','s3','s4'].forEach((id,i)=>{const el=document.getElementById(id); if(el) el.textContent=[s1,s2,s3,s4][i];});
  const tot=document.getElementById('total'); if(tot) tot.textContent=total;
  queueSave();
}
function genReport(){
  const L=cur(); if(!L) return; score();
  const list=queryList(L); const b=L.brand||'[Brand]'; const c=catLabelFor(L); const s=L.scores;
  const missing=list.filter(q=>q.type==='rec'&&L.q[q.id]&&L.q[q.id].named==='no');
  const wrong=list.filter(q=>q.type==='brand'&&L.q[q.id]&&(L.q[q.id].acc==='minor'||L.q[q.id].acc==='major'));
  let r='';
  r+=`COWY AI VISIBILITY REPORT\nPrepared for: ${b}  ·  Category: ${c}  ·  Date: ${new Date().toLocaleDateString()}\n\n`;
  r+=`SUMMARY\nWhen parents ask AI about ${c}, ${b} is named in ${s.namedCount} of ${s.recTotal} recommendation questions tested.\n\n`;
  r+=`AI VISIBILITY SCORE: ${s.total}/100\n  Gets named ........... ${s.s1}/25\n  Likely cited ......... ${s.s2}/25\n  Labels AI can read ... ${s.s3}/25\n  Safety & accuracy .... ${s.s4}/25\n\n`;
  r+=`WHAT WE ASKED AI, AND WHAT CAME BACK\n`;
  if(missing.length){ missing.slice(0,3).forEach(q=>{ r+=`• "${q.t}"\n   Named: ${L.q[q.id].others||'competitors'}. ${b}: not mentioned.\n`; }); }
  else { r+=`• ${b} appeared in the recommendation queries tested.\n`; }
  if(wrong.length){ wrong.forEach(q=>{ r+=`• "${q.t}"  [WRONG FACT]\n   ${L.q[q.id].notes||'AI stated an incorrect detail vs the brand real specs.'}\n`; }); }
  r+=`\nWHY THIS IS HAPPENING\n`;
  if(s.s1<15) r+=`• Low recommendation visibility: competitors are named, ${b} is not, on the questions that decide the sale.\n`;
  if(s.s3<15) r+=`• Thin machine-readable labels: AI can't reliably read your specs/price/ratings, so it skips you.\n`;
  if(s.s2<15) r+=`• Weak citation: AI isn't pulling facts from your own pages.\n`;
  if(s.s4<25) r+=`• Accuracy problem: AI states at least one wrong/outdated fact about your product. Most urgent in a trust-driven category.\n`;
  if(s.s1>=15&&s.s2>=15&&s.s3>=15&&s.s4>=25) r+=`• You're in good shape; the plan below widens your lead.\n`;
  r+=`\n90-DAY FIX PLAN\n  1. Correct the wrong facts AI is citing\n  2. Complete machine-readable product labels (schema + attributes)\n  3. Publish FAQ content answering the real buyer questions above\n  4. Build presence on the parenting/review sites AI trusts\n  5. Strengthen review volume and freshness\n\n`;
  r+=`WHAT HAPPENS NEXT\nThis report is yours to keep. Full plan + monthly monitoring + proof of lift = Done For You at $2,500/mo. The $1,500 for this report credits toward your first month.\n`;
  L.report=r; save();
  const out=document.getElementById('reportOut'); out.style.display='block'; out.value=r;
  renderLeads();
}
function viewReport(id){ state.currentId=id; save(); showTab('audit'); renderAudit(); setTimeout(()=>{const o=document.getElementById('reportOut'); if(o){o.style.display='block'; o.scrollIntoView({behavior:'smooth'});}},150); }
function markSent(btn){ const L=cur(); if(!L) return; L.status='sent'; save(); renderLeads(); if(btn){const p=btn.textContent; btn.textContent='Marked ✓'; setTimeout(()=>btn.textContent=p,1500);} }
function copyReport(btn){ const L=cur(); if(!L) return; if(!L.report) genReport(); robustCopy(L.report, btn, document.getElementById('reportOut')); }

// ---------- utils ----------
function robustCopy(txt, btn, selEl){
  let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt); ok=true;} }catch(e){}
  if(!ok){ try{ const ta=selEl||document.createElement('textarea'); if(!selEl){ta.value=txt; ta.style.position='fixed';ta.style.opacity='0'; document.body.appendChild(ta);} ta.focus(); ta.select(); ok=document.execCommand('copy'); if(!selEl) document.body.removeChild(ta);}catch(e){} }
  if(btn){const p=btn.textContent; btn.textContent=ok?'Copied ✓':'select & copy'; setTimeout(()=>btn.textContent=p,1500);}
}
function exportAll(btn){
  let out='COWY — ALL LEADS\n\n';
  state.clients.forEach(L=>{ out+=`${L.brand} (${catLabelFor(L)}) — ${L.status}${L.scores?' — '+L.scores.total+'/100':''}\n  ${L.email||''} ${L.comp?'· vs '+L.comp:''}\n\n`; });
  robustCopy(out, btn);
}
function esch(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
load();
